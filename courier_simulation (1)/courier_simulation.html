<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courier Database Simulation</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#12263f;--line:#d5dbe3;--acc:#f28c28;--ok:#1b7f3b;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#17202f;--ink:#e8edf5;--line:#2b384c;--ok:#5fd17f;--bad:#ff7b7b}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#17202f;--ink:#e8edf5;--line:#2b384c;--ok:#5fd17f;--bad:#ff7b7b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Calibri,Segoe UI,Arial,sans-serif}
h1{margin:0;padding:14px 16px;background:#12263f;color:#fff;font-size:20px;border-bottom:4px solid var(--acc)}
main{max-width:900px;margin:0 auto;padding:12px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow-x:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
select,input{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:15px}
button{padding:9px 14px;border:0;border-radius:6px;background:#12263f;color:#fff;font-size:15px;cursor:pointer}
button.on{background:var(--acc)}
#msg{margin-top:10px;font-weight:bold}
table{border-collapse:collapse;width:100%;font-size:14px}th{background:#12263f;color:#fff;text-align:left;padding:6px}td{padding:6px;border-bottom:1px solid var(--line)}
#log{background:#0f1b2d;color:#9be29b;font:13px Consolas,monospace;padding:10px;border-radius:6px;height:150px;overflow:auto;white-space:pre-wrap}
.e{color:#ff8a8a}.hint{font-size:13px;opacity:.75;margin-top:8px}
</style></head><body>
<h1>📦 Courier Parcel Tracking: Simple Simulation</h1>
<main>
<div class="card">
<div class="row" id="tabs"></div>
<div class="row" id="form" style="margin-top:12px"></div>
<div id="msg"></div><div class="hint" id="hint"></div>
</div>
<div class="card"><b>Parcels</b><div id="tb"></div></div>
<div class="card"><b>SQL Log</b><div id="log"></div></div>
</main>
<script>
const MAP={BOOKED:'BOOKED',PICKED_UP:'IN_TRANSIT',AT_HUB:'IN_TRANSIT',OUT_FOR_DELIVERY:'OUT_FOR_DELIVERY',DELIVERED:'DELIVERED'};
let P=[{t:'TRK1001',w:2.5,s:'DELIVERED',seq:5,ch:65,paid:65},{t:'TRK1002',w:5,s:'IN_TRANSIT',seq:3,ch:180,paid:100}],n=1003,tab='Book';
const $=i=>document.getElementById(i);
const log=(t,e)=>{$('log').innerHTML+=`<div class="${e?'e':''}">${e?'':'mysql> '}${t}</div>`;$('log').scrollTop=1e9};
const say=(ok,t)=>{$('msg').style.color=ok?'var(--ok)':'var(--bad)';$('msg').textContent=t};
const bad=(sql,t)=>{log(sql);log('ERROR: '+t,1);say(0,'Error: '+t)};
const opts=a=>a.map(x=>`<option>${x}</option>`).join('');
const HINT={Book:'Try weight = -3 (CHECK constraint fails). Charge = 40 + 10 x weight.',Scan:'Try a wrong sequence number, or scan TRK1001 (already delivered).',Pay:'Try paying more than the charge.'};
function tabs(){$('tabs').innerHTML=['Book','Scan','Pay'].map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';tabs();form()">${k}</button>`).join('');}
function form(){const ps=opts(P.map(p=>p.t));$('hint').textContent=HINT[tab];$('msg').textContent='';
$('form').innerHTML=tab=='Book'?`<input id="w" type="number" value="2" placeholder="Weight kg"><button onclick="book()">Book Parcel</button>`
:tab=='Scan'?`<select id="p" onchange="sq()">${ps}</select><select id="ty">${opts(Object.keys(MAP).slice(1))}</select><input id="q" type="number" style="width:80px"><button onclick="scan()">Add Scan</button>`
:`<select id="p">${ps}</select><input id="a" type="number" value="10"><button onclick="pay()">Pay</button>`;if(tab=='Scan')sq();}
const get=()=>P.find(x=>x.t==$('p').value);
const sq=()=>$('q').value=get().seq+1;
function book(){const w=parseFloat($('w').value),t='TRK'+n,sql=`INSERT INTO Parcel (tracking_no, weight_kg) VALUES ('${t}', ${w});`;
if(isNaN(w)||w<=0)return bad(sql,'CHECK constraint violated (weight_kg > 0)');
n++;P.push({t,w,s:'BOOKED',seq:1,ch:40+10*w,paid:0});log(sql);say(1,`Booked ${t}. Charge = Rs. ${40+10*w}`);draw();}
function scan(){const p=get(),ty=$('ty').value,q=+$('q').value,sql=`INSERT INTO ScanEvent (parcel, seq_no, scan_type) VALUES ('${p.t}', ${q}, '${ty}');`;
if(p.s=='DELIVERED')return bad(sql,'No scans allowed after delivery');
if(q!=p.seq+1)return bad(sql,'Invalid scan sequence');
p.seq=q;p.s=MAP[ty];log(sql);log(`UPDATE Parcel SET status='${p.s}';  -- trigger`);say(1,`${p.t} is now ${p.s}`);draw();sq();}
function pay(){const p=get(),a=parseFloat($('a').value),sql=`INSERT INTO Payment (booking, amount) VALUES ('${p.t}', ${a});`;
if(isNaN(a)||a<=0)return bad(sql,'CHECK constraint violated (amount > 0)');
if(p.paid+a>p.ch)return bad(sql,'Payment exceeds total charge');
p.paid+=a;log(sql);say(1,`Paid Rs. ${a}. Due: Rs. ${p.ch-p.paid}`);draw();}
function draw(){const v=$('p')?$('p').value:'';$('tb').innerHTML='<table><tr><th>Tracking</th><th>Weight</th><th>Status</th><th>Charge</th><th>Paid</th></tr>'+P.map(p=>`<tr><td>${p.t}</td><td>${p.w} kg</td><td>${p.s}</td><td>${p.ch}</td><td>${p.paid}</td></tr>`).join('')+'</table>';
if($('p')&&tab!='Book'){$('p').innerHTML=opts(P.map(x=>x.t));$('p').value=v;}}
tabs();form();draw();log('USE courier_db;  -- sample data loaded');
</script></body></html>
